  $('mkd').textContent=(LV[L].goal==='earth'?'EARTH ':'MARS ')+Math.round(P.position.distanceTo(gl))}

const joy=$('joy'),kn=$('knob');
function jm(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+65),dy=e.clientY-(r.top+65);const m=Math.hypot(dx,dy);if(m>50){dx*=50/m;dy*=50/m}jx=dx/50;jy=dy/50;kn.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);jm(e)});

['pointerup','pointercancel'].forEach(n=>joy.addEventListener(n,()=>{jx=jy=0;kn.style.transform=''}));

function kk(){jx=(K.ArrowRight||K.d?1:0)-(K.ArrowLeft||K.a?1:0);jy=(K.ArrowDown||K.s?1:0)-(K.ArrowUp||K.w?1:0);boost=!!K[' '];brake=!!(K.Shift||K.b)}
